# Codemagic cloud build for the Stitch'd iOS app.
#
# This runs the whole iOS build on a Mac in the cloud — no local Mac needed.
# Codemagic checks out the repo, builds the web app, syncs it into the iOS
# project, signs it (certificates created automatically from your App Store
# Connect API key), and uploads it to TestFlight/App Store Connect.
#
# One-time setup in the Codemagic web app (see MAC_SETUP.md → "Cloud build"):
#   1. Connect this GitHub repo.
#   2. Team settings → Integrations → App Store Connect → add an API key,
#      and name it EXACTLY:  Stitchd App Store Key
#   (That name must match `integrations.app_store_connect` below.)

workflows:
  ios-appstore:
    name: Stitch'd iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Auto-start a build on every push to main — so changes build and ship to
    # TestFlight hands-free without pressing "Start new build". Requires the
    # GitHub webhook, which Codemagic added when the repo was connected.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    integrations:
      app_store_connect: Stitchd App Store Key
    environment:
      groups:
        - ios_credentials   # provides CERTIFICATE_PRIVATE_KEY (a persistent key,
                            # added as a secure env var in the Codemagic UI)
      vars:
        BUNDLE_ID: "fit.stitchd.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets and sync Capacitor
        script: |
          npm run build
          npx cap sync ios
      - name: Set the build number
        script: |
          # Give every upload a unique, strictly-increasing build number. Apple
          # rejects a build whose number isn't higher than one already on
          # TestFlight, so base it on the latest TestFlight build number and add
          # 1. If that lookup returns nothing — the first-ever upload, or
          # APP_STORE_APP_ID not set — fall back to Codemagic's own
          # auto-incrementing $BUILD_NUMBER, which also increases on every build.
          # Either way the number keeps moving forward and won't clash with the
          # previous TestFlight upload.
          #
          # APP_STORE_APP_ID is the app's numeric App Store Connect ID. Add it as
          # an env var in the Codemagic UI (like CERTIFICATE_PRIVATE_KEY) to turn
          # on TestFlight-based numbering.
          set -e
          LATEST_TESTFLIGHT_BUILD_NUMBER=""
          if [ -n "${APP_STORE_APP_ID:-}" ]; then
            LATEST_TESTFLIGHT_BUILD_NUMBER=$(
              app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || true
            )
          fi
          if [ -n "$LATEST_TESTFLIGHT_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER=$((LATEST_TESTFLIGHT_BUILD_NUMBER + 1))
          else
            NEW_BUILD_NUMBER="$BUILD_NUMBER"
          fi
          cd ios/App
          agvtool new-version -all "$NEW_BUILD_NUMBER"
      - name: Sign and build the .ipa
        script: |
          # Do signing + archive in ONE step: Codemagic runs each step in a fresh
          # shell, so the keychain/certificate/profile state must live in the same
          # step as the build or the archive fails with "requires a provisioning
          # profile". Create the distribution certificate + App Store profile if
          # they don't exist (first build), apply them, then archive.
          keychain initialize
          # Use a FIXED private key (CERTIFICATE_PRIVATE_KEY secret) so the same
          # distribution certificate is reused on every build. Without a
          # persistent key, each build created a certificate whose private key
          # died with the machine, so the next build couldn't sign.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Uploads the build to App Store Connect. Internal TestFlight testers get it
      # automatically once Apple finishes processing — no submit step needed.
      # (submit_to_testflight was racing Apple's processing and turning the build
      # red even though the upload succeeded.) To add EXTERNAL testers or ship to
      # the public App Store later, we'll add beta_groups / submit_to_app_store.
      app_store_connect:
        auth: integration
